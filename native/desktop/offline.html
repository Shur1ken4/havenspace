<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>HavenSpace</title>
<style>
  :root { --bg: #FAF8F5; --ink: #2F3A35; --muted: #616D66; --primary: #4A6D5B; --on-primary: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1E2421; --ink: #E4E7E2; --muted: #A9B3AC; --primary: #8FB09D; --on-primary: #1E2421; } }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { font: 600 28px/1.3 Georgia, "Times New Roman", serif; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; max-width: 420px; }
  button { min-height: 44px; padding: 0 22px; border-radius: 12px; border: 0; background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 500; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <h1 id="title">HavenSpace can't connect</h1>
    <p id="body">Check your internet connection. HavenSpace will reconnect by itself once you're online.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script src="offline.js"></script>
</body>
</html>
