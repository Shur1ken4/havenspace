<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'">
<title>HavenSpace</title>
<style>
  :root { --bg: #FAF8F5; --surface: #FFFFFF; --ink: #2F3A35; --muted: #616D66; --line: #E7E2DA; --primary: #4A6D5B; --primary-soft: #E6EEE9; --on-primary: #FFFFFF; --attention-soft: #F6E9DD; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1E2421; --surface: #262D29; --ink: #E4E7E2; --muted: #A9B3AC; --line: #36403A; --primary: #8FB09D; --primary-soft: #2F3B34; --on-primary: #1E2421; --attention-soft: #3A3128; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; display: flex; flex-direction: column; }
  header { padding: 20px 24px 8px; }
  h1 { margin: 0; font: 600 22px/1.3 Georgia, "Times New Roman", serif; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  main { flex: 1; overflow-y: auto; padding: 8px 24px 16px; }
  h2 { margin: 16px 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .source { display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .source:hover { border-color: var(--muted); }
  .source[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
  .source:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .thumb { aspect-ratio: 16 / 10; width: 100%; border-radius: 8px; background: var(--line); object-fit: contain; }
  .name { display: flex; align-items: center; gap: 6px; font-size: 13px; overflow: hidden; }
  .name img { width: 16px; height: 16px; flex: none; }
  .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note { margin: 12px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--attention-soft); font-size: 14px; }
  footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 24px; border-top: 1px solid var(--line); }
  button.action { min-height: 40px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 500; cursor: pointer; }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  button.action:disabled { opacity: .5; cursor: default; }
  button.action:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
</style>
</head>
<body>
  <header>
    <h1 id="title"></h1>
    <p id="hint"></p>
  </header>
  <main>
    <p id="blocked" class="note" hidden></p>
    <h2 id="screensTitle"></h2>
    <div id="screens" class="grid" role="group"></div>
    <h2 id="windowsTitle"></h2>
    <div id="windows" class="grid" role="group"></div>
  </main>
  <footer>
    <button type="button" class="action" id="cancel"></button>
    <button type="button" class="action primary" id="share" disabled></button>
  </footer>
  <script src="picker.js"></script>
</body>
</html>
