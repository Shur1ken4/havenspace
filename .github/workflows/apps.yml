# Builds the downloadable apps on GitHub's computers, checks them, and publishes
# them as a GitHub release (ADR-20). The website's Download buttons link to the
# newest release.
#   Run it: GitHub → Actions → "Apps" → Run workflow (enter a version), or push a tag apps-v1.2.3.
name: Apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, for example 1.0.0"
        required: true
        default: "1.0.0"
  push:
    tags: ["apps-v*"]

permissions:
  contents: write

concurrency:
  group: apps
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/desktop/package-lock.json
      - run: npm ci
      - name: Set the version
        run: npm version "${VERSION#apps-v}" --no-git-tag-version --allow-same-version
      - name: Build (test build with an ad-hoc signature)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check the app's signature is intact
        run: codesign --verify --deep --strict --verbose=2 dist/mac-universal/HavenSpace.app
      - name: Start the app and check it opens HavenSpace
        run: |
          npm install --no-save playwright-core@1
          node smoke-test.mjs dist/mac-universal/HavenSpace.app/Contents/MacOS/HavenSpace mac-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: native/desktop/dist/HavenSpace-Mac.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-mac
          path: native/desktop/mac-smoke.png
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/desktop/package-lock.json
      - run: npm ci
      - name: Set the version
        run: npm version "${VERSION#apps-v}" --no-git-tag-version --allow-same-version
      - name: Build (unsigned test build)
        run: npm run dist:win
      - name: Start the app and check it opens HavenSpace
        run: |
          npm install --no-save playwright-core@1
          node smoke-test.mjs dist/win-unpacked/HavenSpace.exe windows-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: native/desktop/dist/HavenSpace-Windows-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-windows
          path: native/desktop/windows-smoke.png
          if-no-files-found: ignore

  android:
    if: vars.ANDROID_SIGNING == 'on'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @bubblewrap/cli@1.27.0
      - name: Android build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "build-tools;36.1.0" > /dev/null
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
      - name: Set the version (each build counts up, so phones accept it as an update)
        run: |
          jq --arg v "${VERSION#apps-v}" --argjson c "${{ github.run_number }}" '.appVersion = $v | .appVersionCode = $c' twa-manifest.json > m.json
          mv m.json twa-manifest.json
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > android.keystore
      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation
          mv app-release-signed.apk HavenSpace-Android.apk
          rm -f android.keystore
      - name: Check the app (package, Android versions, screen support, signature)
        run: |
          BT="$ANDROID_HOME/build-tools/36.1.0"
          "$BT/aapt2" dump badging HavenSpace-Android.apk | grep -E "^package|sdkVersion|targetSdkVersion|supports-screens|densities|application-label|launchable-activity"
          "$BT/apksigner" verify --print-certs HavenSpace-Android.apk | tee certs.txt
          APP=$(grep -m1 "SHA-256 digest" certs.txt | sed 's/.*: //' | tr 'a-f' 'A-F')
          SITE=$(jq -r '.[0].target.sha256_cert_fingerprints[0]' ../../apps/web/public/.well-known/assetlinks.json | tr -d ':')
          echo "app signature: $APP"
          echo "site expects:  $SITE"
          [ "$APP" = "$SITE" ] || { echo "The app's signature doesn't match the website's assetlinks.json"; exit 1; }
          mkdir -p ../../icons && cp -r app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable-xxxhdpi ../../icons/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: native/android/HavenSpace-Android.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: check-android-icons
          path: icons
          if-no-files-found: ignore

  android-phone-test:
    needs: android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone
            profile: pixel_7
          - name: small-phone
            profile: Nexus 5
          - name: tablet
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: apk
      - name: Allow the virtual phone to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, open and screenshot on a virtual ${{ matrix.name }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash native/android/emulator-check.sh apk/HavenSpace-Android.apk shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-android-${{ matrix.name }}
          path: shots
          if-no-files-found: ignore

  release:
    needs: [mac, windows, android, android-phone-test]
    if: ${{ !cancelled() && needs.mac.result == 'success' && needs.windows.result == 'success' && needs.android.result != 'failure' && needs.android-phone-test.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          pattern: "{mac,windows,android}"
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${VERSION#apps-v}"
          TAG="apps-v$V"
          ls -la files
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber
          else
            gh release create "$TAG" files/* --target "$GITHUB_SHA" --title "HavenSpace apps $V" --latest --notes-file .github/apps-release-notes.md
          fi
