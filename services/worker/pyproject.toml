[project]
name = "psych-worker"
version = "0.1.0"
description = "Background worker: transcription, speaker labelling, audio deletion and the note/reflection pipeline."
requires-python = ">=3.11,<3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "anthropic>=1.0",
  "boto3>=1.35",
  "numpy>=1.26,<2.3",
  "av>=12",
  "faster-whisper>=1.1",
  "speechbrain>=1.0",
  "torch>=2.4",
  "torchaudio>=2.4",
  "huggingface_hub>=0.24",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
